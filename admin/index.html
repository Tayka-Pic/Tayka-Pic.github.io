// ---------------------------------------------------------------------------


// ---------------------------------------------------------------------------
//  Backups
// ---------------------------------------------------------------------------
//
//  The card on Home carries a file count, which answers none of the questions
//  an operator actually has. `backup_status` has always returned twelve
//  fields and `backup_history` has always returned the last fifty beats, and
//  nothing drew either -- so "is the newest dump usable", "how old is the
//  encrypted copy" and "has this been failing quietly" were all one RPC away
//  and unreachable.
//
//  THE FAILURE THIS PAGE IS SHAPED AROUND
//
//  The database half of this backup once produced 452 consecutive EMPTY dumps
//  while the panel said fine, for five days. A green light that only means
//  "the daemon is running" is worse than no light, so every row below says
//  what it is and when it last happened, and the two rows that can be quietly
//  wrong -- the age of the newest usable dump, and the age of the newest
//  encrypted copy -- are called out rather than left in a list.
//
//  Nothing here can BE done from the console. The box is behind Cloudflare
//  Access and the fixes need a shell, so this page reports and links; it does
//  not pretend to have buttons that work.

function ago(iso) {
  if (!iso) return "never";
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return `${hrs} hr ago`;
  return `${Math.round(hrs / 24)} days ago`;
}

//  A number of hours, judged rather than printed. The thresholds are the ones
//  the daemon itself runs on: a cycle every 30 minutes, a dump every night.
function freshness(hours, warnAfter, badAfter) {
  if (hours === null || hours === undefined) return { word: "unknown", bad: true };
  const h = Number(hours);
  if (h >= badAfter)  return { word: `${Math.round(h)} hr old`, bad: true };
  if (h >= warnAfter) return { word: `${Math.round(h)} hr old`, warn: true };
  return { word: `${Math.round(h)} hr old`, ok: true };
}

function bigRow(label, value, state, note) {
  const colour = state.bad ? "var(--danger)"
               : state.warn ? "var(--accent)" : "var(--good)";
  return `<div class="widget" style="text-align:left">
    <h3 style="color:${colour}">${esc(value)}</h3>
    <div class="sub"><strong>${esc(label)}</strong></div>
    ${note ? `<div class="sub">${esc(note)}</div>` : ""}
  </div>`;
}

async function renderBackups() {
  main.innerHTML = `<div class="muted">Loading…</div>`;

  let b = null, hist = [], err = null;
  try {
    b = (await rpc("backup_status", { p_source: "tayka-backup" }))?.[0] ?? null;
    hist = (await rpc("backup_history", { p_source: "tayka-backup", p_limit: 50 })) ?? [];
  } catch (e) { err = e.message; }

  if (err) { errorWithRetry(main, err, () => renderBackups()); return; }

  if (!b) {
    main.innerHTML = `<h2>Backups</h2>
      <div class="alarm"><h3>The backup has never reported</h3>
      <div class="sub">No heartbeat has ever reached this database from
      <code>tayka-backup</code>. Either the box has never run, or its heartbeat
      cannot reach Supabase. Check <code>systemctl status tayka-sync</code> on the box.</div></div>`;
    return;
  }

  const detail = b.detail || {};
  const dumpAge = freshness(b.db_backup_age_hours, 26, 48);
  const encAge  = freshness(detail.encrypted_db_age_hours, 26, 48);
  const beat    = b.age_minutes === null || b.age_minutes === undefined
                    ? { word: "never", bad: true }
                    : (b.age_minutes > 120 ? { word: `${Math.round(b.age_minutes)} min ago`, bad: true }
                       : b.age_minutes > 60 ? { word: `${Math.round(b.age_minutes)} min ago`, warn: true }
                       : { word: `${Math.round(b.age_minutes)} min ago`, ok: true });

  //  The three that can be quietly wrong, first and large. Everything else is
  //  a fact in a table below.
  const headline = `
    <div class="widgets">
      ${bigRow("Newest usable database dump", dumpAge.word, dumpAge,
               b.last_db_backup ? `taken ${fmtWhen(b.last_db_backup)}` : "there is no usable dump at all")}
      ${bigRow("Newest encrypted copy", encAge.word, encAge,
               "decryptable only with the key on Noah's Mac")}
      ${bigRow("Last heartbeat", beat.word, beat,
               b.is_stale ? "the box has stopped reporting" : "the daemon is reporting in")}
    </div>`;

  const failing = (b.db_consecutive_failures ?? 0) > 0;
  const alarm = failing
    ? `<div class="alarm"><h3>The backup is running and failing</h3>
        <div class="sub">${esc(b.db_consecutive_failures)} database dump${b.db_consecutive_failures === 1 ? "" : "s"}
        in a row produced nothing. The daemon is alive, which is why nothing else looks wrong.
        This is the exact shape of the failure that ran for five days: 452 empty dumps behind a green light.</div></div>`
    : "";

  const rows = [
    ["Source", b.source],
    ["Database healthy", b.db_healthy ? "yes" : "no"],
    ["Consecutive failed dumps", b.db_consecutive_failures ?? 0],
    ["Usable database backups kept", b.database_backups_ok ?? "?"],
    ["Database size", b.database_size_mb != null ? `${Math.round(b.database_size_mb)} MB` : "?"],
    ["Photo files mirrored", b.storage_files ?? "?"],
    ["Photo size", b.storage_size_mb != null ? `${Math.round(b.storage_size_mb)} MB` : "?"],
    ["Last full sync", b.last_sync ? `${fmtWhen(b.last_sync)} (${ago(b.last_sync)})` : "never"],
    ["Last usable dump", b.last_db_backup ? `${fmtWhen(b.last_db_backup)} (${ago(b.last_db_backup)})` : "never"],
    ["Heartbeat at", b.at ? `${fmtWhen(b.at)} (${ago(b.at)})` : "never"],
  ];
  //  Anything the box reports that this page does not have a row for. Written
  //  out rather than dropped, so a field added on the box shows up here the
  //  day it starts being sent instead of waiting for someone to edit this file.
  const known = new Set(["encrypted_db_age_hours"]);
  for (const [k, v] of Object.entries(detail)) {
    if (known.has(k)) continue;
    rows.push([k.replace(/_/g, " "), typeof v === "object" ? JSON.stringify(v) : String(v)]);
  }

  const table = `<h2>What the box last said</h2>
    <table><tbody>${rows.map(([k, v]) =>
      `<tr><td class="muted">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</tbody></table>`;

  //  One cell per beat, newest on the right, so a run of failures is a visible
  //  band rather than a number somebody has to notice.
  const strip = hist.length ? `<h2>The last ${hist.length} cycles</h2>
    <div class="bars" style="display:flex;gap:3px;align-items:flex-end;height:52px">
      ${hist.slice().reverse().map(h => {
        const bad = !h.db_healthy || (h.db_consecutive_failures ?? 0) > 0;
        return `<div class="bar" title="${esc(fmtWhen(h.at))} — ${bad ? "failing" : "ok"}"
          style="flex:1;height:${bad ? 100 : 60}%;border-radius:2px;
          background:${bad ? "var(--danger)" : "var(--good)"}"></div>`;
      }).join("")}
    </div>
    <p class="muted">Newest on the right. A tall red cell is a cycle whose database dump produced nothing.</p>`
    : `<p class="muted">No history yet.</p>`;

  const runbook = `<h2>If something here is wrong</h2>
    <p class="muted">Nothing on this page can be fixed from the console; the box is behind
    Cloudflare Access and the fixes need a shell. On the Mac:</p>
    <table><tbody>
      <tr><td class="muted">Look at the daemon</td><td><code>ssh tayka</code> then <code>journalctl -u tayka-sync -n 50</code></td></tr>
      <tr><td class="muted">Run a cycle now</td><td><code>systemctl --user restart tayka-sync</code></td></tr>
      <tr><td class="muted">Check a dump is real</td><td><code>gzip -dc backups/db/&lt;newest&gt;.sql.gz | head</code></td></tr>
      <tr><td class="muted">Decrypt a copy</td><td>needs the private key, which exists only on Noah's Mac</td></tr>
    </tbody></table>`;

  main.innerHTML = `<h2>Backups</h2>${alarm}${headline}${table}${strip}${runbook}`;
}


// ---------------------------------------------------------------------------
//  Usage over time
// ---------------------------------------------------------------------------
//
//  admin_dashboard could say how many people posted today and could not say
//  whether today was better or worse than last Tuesday. Worse, it could not
//  tell apart the two failures that matter most to a daily app: somebody who
//  has stopped opening Tayka is lost, and somebody who opens it and does not
//  post is a prompt problem or a friend problem and is still there to be won
//  back. One "posted today" figure reports those identically.
//
//  A stacked bar rather than three lines, because the three populations add up
//  to one whole: a line per population makes the reader do the addition, a
//  stack shows the whole and the split in the same glyph. The conversion rate
//  is written out in words above it, because it is the number the rest of the
//  screen exists to explain.
//
//  No chart library. Three divs in a column with percentage heights is the
//  whole of it, and the console loads nothing it does not need.

let usageDays = 30;

//  The three bands, as one place rather than three literals. "Did not open"
//  was `var(--hairline)`, #232b42 on a #08090f ground: readable as a tall band
//  and invisible as a 12px legend swatch, so the key looked like it had two
//  entries and a gap. A dimmed `--secondary` reads on both.
const USAGE_BANDS = {
  posted: { fill: "var(--accent)",    opacity: 1,   name: "Posted",
            note: "Answered the prompt." },
  opened: { fill: "var(--accent)",    opacity: .4,  name: "Opened, no Tayk",
            note: "Came back and left without posting." },
  absent: { fill: "var(--secondary)", opacity: .35, name: "Did not open",
            note: "Did not open Tayka at all." },
};

function usageBar(d, tallest, i) {
  const total = Math.max(d.total_users, 1);
  const h = (n) => `${(n / total) * 100}%`;
  const seg = (b, n) => `<div style="height:${h(n)};background:${b.fill};opacity:${b.opacity}"></div>`;
  //  Posted at the bottom so the band that matters most shares an edge with
  //  the axis and can be compared across days by eye.
  const posted = d.opened_and_posted + d.posted_not_opened;
  return `<div class="ubar" data-i="${i}" tabindex="0"
       style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;
              height:${(total / Math.max(tallest, 1)) * 100}%;min-width:4px;
              cursor:default;outline-offset:2px">
    ${seg(USAGE_BANDS.absent, d.neither)}
    ${seg(USAGE_BANDS.opened, d.opened_not_posted)}
    ${seg(USAGE_BANDS.posted, posted)}
  </div>`;
}

const usageDate = (iso, long) => new Date(iso).toLocaleDateString(undefined,
  long ? { weekday: "short", month: "short", day: "numeric" }
       : { month: "short", day: "numeric" });

//  One line per band in the key, drawn from the same table the bars use.
function usageKey() {
  return Object.values(USAGE_BANDS).map(b => `
    <div class="row" style="align-items:flex-start;gap:8px;margin-bottom:6px">
      <span style="width:12px;height:12px;border-radius:3px;flex:0 0 auto;margin-top:3px;
                   background:${b.fill};opacity:${b.opacity}"></span>
      <div><strong>${esc(b.name)}</strong><div class="sub">${esc(b.note)}</div></div>
    </div>`).join("");
}

//  What the reader is told above the chart, and the reason it is three cases
//  rather than one sentence about today.
//
//  `opened` is zero both when nobody came and when opens are not being
//  RECORDED, and those are completely different facts. app_opens is written by
//  a build that has not shipped, so every day reads zero - and "nobody has
//  opened Tayka yet today" is then a false alarm about the busiest week the
//  app has had. Same missing-third-state shape as a spinner standing in for a
//  photo that will never arrive.
function usageHeadline(days, latest) {
  const everOpened = days.some(d => d.opened > 0);
  if (!everOpened) {
    return `<p class="muted">No app opens have been recorded yet, on any day in
      this window, so the <strong>Opened</strong> and <strong>Did not open</strong>
      bands are empty and the totals below read zero. Recording starts with the
      first build that contains it. The <strong>Posted</strong> band and the
      account totals are real and current.</p>`;
  }
  if (!latest.opened) {
    if (latest.opened_and_posted + latest.posted_not_opened > 0) {
      return `<p class="muted">No opens recorded today, though
        <strong>${esc(latest.posted_not_opened + latest.opened_and_posted)}</strong>
        posted. Opens come only from the build that added them.</p>`;
    }
    return `<p class="muted">Nobody has opened Tayka yet today. ${esc(latest.total_users)} accounts exist.</p>`;
  }
  //  A FOURTH CASE, AND THE LONGEST-LIVED ONE. The all-zero check above covers
  //  the day nothing is recorded; it says nothing about the far longer stretch
  //  where SOME builds record and some do not, which is where this sits now.
  //
  //  You cannot post without opening the app, so `posted_not_opened` is a
  //  direct and undeniable measure of under-recording, and its lower bound. On
  //  the day this was written it was three accounts with opens against nine who
  //  posted, and the sentence below would have read "3 of 28 opened Tayka" on a
  //  busy day, on the one screen built to say whether the app is growing.
  //
  //  It resolves itself as testers update, which is precisely why it has to be
  //  said out loud: a wrong number that will be right eventually is read as a
  //  right number today.
  if (latest.posted_not_opened > 0) {
    const posted = latest.opened_and_posted + latest.posted_not_opened;
    return `<p class="muted">Opens are <strong>under-counted</strong> today:
      <strong>${esc(latest.posted_not_opened)}</strong> posted with no open
      recorded, and posting requires opening. Only devices on the build that
      added opens write a row, so treat the rate as a floor until testers
      update. <strong>${esc(posted)}</strong> of ${esc(latest.total_users)}
      posted, and that figure is exact.</p>`;
  }
  const rate = Math.round((latest.opened_and_posted / latest.opened) * 100);
  return `<p class="muted">Today <strong>${esc(latest.opened)}</strong> of
    ${esc(latest.total_users)} opened Tayka and <strong>${esc(latest.opened_and_posted)}</strong>
    of those posted, which is <strong>${esc(rate)}%</strong>.</p>`;
}

async function renderUsage() {
  main.innerHTML = `<div class="muted">Loading…</div>`;

  let days;
  try { days = await rpc("usage_by_day", { p_days: usageDays }); }
  catch (e) { errorWithRetry(main, e.message, () => renderUsage()); return; }

  const picker = `<div class="subnav" id="unav">
      ${[7, 30, 90].map(n =>
        `<button data-days="${n}" aria-current="${n === usageDays}">${n} days</button>`).join("")}
    </div>`;
  const wirePicker = () => main.querySelectorAll("#unav button").forEach(b =>
    b.onclick = () => { usageDays = Number(b.dataset.days); renderUsage(); });

  if (!days || days.length === 0) {
    main.innerHTML = `<h2>Usage</h2>${picker}
      <p class="muted">No usage recorded yet. Opens are recorded from the build that
      added them, so this fills in from today forward.</p>`;
    wirePicker();
    return;
  }

  const latest = days[days.length - 1];
  const tallest = Math.max(...days.map(d => d.total_users), 1);

  //  A label every so often rather than on all ninety. Each cell is flex:1 to
  //  match a bar, so the dates line up with the columns they name whatever the
  //  window is.
  const every = Math.max(1, Math.ceil(days.length / 6));
  const axis = days.map((d, i) =>
    `<div style="flex:1;min-width:4px;text-align:center;overflow:visible;white-space:nowrap">
       ${i % every === 0 || i === days.length - 1 ? esc(usageDate(d.day_start)) : ""}
     </div>`).join("");

  main.innerHTML = `<h2>Usage</h2>${picker}
    ${usageHeadline(days, latest)}

    <div id="uread" class="muted" style="min-height:20px;margin-bottom:6px">
      Hover a bar for that day.</div>

    <div id="ubars" style="display:flex;gap:2px;align-items:flex-end;height:180px;
                border-bottom:1px solid var(--hairline);padding-bottom:2px">
      ${days.map((d, i) => usageBar(d, tallest, i)).join("")}
    </div>
    <div style="display:flex;gap:2px;margin-top:6px;font-size:11px;color:var(--secondary)">
      ${axis}
    </div>
    <p class="muted" style="margin-top:6px">Oldest on the left. Bar height is the
      accounts that existed that day, so the bars grow as Tayka does.</p>

    <h2>What the bands mean</h2>
    ${usageKey()}

    <h2>The numbers</h2>
    <table><tbody>
      <tr><td class="muted">Day</td><td class="muted">Posted</td>
          <td class="muted">Opened</td><td class="muted">Accounts</td><td class="muted">New</td></tr>
      ${days.slice().reverse().map(d => `<tr>
        <td>${esc(usageDate(d.day_start))}</td>
        <td>${esc(d.opened_and_posted + d.posted_not_opened)}</td>
        <td>${esc(d.opened)}</td>
        <td>${esc(d.total_users)}</td>
        <td>${esc(d.new_users)}</td></tr>`).join("")}
    </tbody></table>`;

  //  Hover and keyboard focus both fill the readout. The bars carry tabindex,
  //  so a keyboard reaches every day the mouse can - a chart whose only way in
  //  is a pointer is a chart half the people cannot read.
  const readout = document.getElementById("uread");
  const idle = "Hover a bar for that day.";
  const show = (i) => {
    const d = days[i];
    const posted = d.opened_and_posted + d.posted_not_opened;
    const rate = d.opened ? ` · ${Math.round((d.opened_and_posted / d.opened) * 100)}% of openers posted` : "";
    readout.innerHTML = `<strong>${esc(usageDate(d.day_start, true))}</strong> ·
      ${esc(posted)} posted · ${esc(d.opened_not_posted)} opened without posting ·
      ${esc(d.neither)} did not open · ${esc(d.total_users)} accounts${esc(rate)}`;
  };
  main.querySelectorAll("#ubars .ubar").forEach(b => {
    const i = Number(b.dataset.i);
    b.addEventListener("mouseenter", () => show(i));
    b.addEventListener("focus", () => show(i));
    b.addEventListener("mouseleave", () => { readout.textContent = idle; });
    b.addEventListener("blur", () => { readout.textContent = idle; });
  });

  wirePicker();
}

// ---------------------------------------------------------------------------
//  Operators
// ---------------------------------------------------------------------------
//
//  Owner-only, and the server says so rather than this file. list_admins,
//  add_admin, remove_admin and set_admin_role all check is_owner() as their
//  first line, so hiding the tab is a courtesy and not the control: an admin
//  who forced the nav open finds every button refused.
//
//  Why the split exists at all: an admin who can appoint an admin can appoint
//  themselves an owner, and then owner means nothing. Everything else an
//  operator could do yesterday, an admin can still do.

async function renderOperators() {
  main.innerHTML = `<div class="muted">Loading…</div>`;

  let rows;
  try { rows = await rpc("list_admins"); }
  catch (e) { errorWithRetry(main, e.message, () => renderOperators()); return; }

  if (!rows || rows.length === 0) {
    main.innerHTML = `<h2>Operators</h2>
      <p class="note">Only an owner can see or change the operator list.</p>`;
    return;
  }

  const owners = rows.filter(r => r.role === "owner").length;

  main.innerHTML = `<h2>Operators</h2>
    <table><tbody>
      ${rows.map(r => `<tr>
        <td>
          <strong>@${esc(r.username)}</strong>
          <span class="tag${r.role === "owner" ? "" : " grey"}">${esc(r.role)}</span>
          ${r.is_you ? `<span class="muted"> · you</span>` : ""}
          <div class="sub">added ${esc(fmtWhen(r.added_at))}</div>
        </td>
        <td style="text-align:right;white-space:nowrap">
          ${r.role === "owner"
            ? `<button class="quiet" data-role="admin" data-user="${esc(r.username)}"
                 ${owners <= 1 ? "disabled title='the last owner cannot be demoted'" : ""}>Make admin</button>`
            : `<button class="quiet" data-role="owner" data-user="${esc(r.username)}">Make owner</button>`}
          <button class="danger" data-remove="${esc(r.username)}"
            ${r.role === "owner" && owners <= 1 ? "disabled title='the last owner cannot be removed'" : ""}>Remove</button>
        </td></tr>`).join("")}
    </tbody></table>

    <h2>Add an operator</h2>
    <div class="row">
      <input id="newAdmin" placeholder="username" autocapitalize="off" autocorrect="off" style="max-width:240px">
      <button class="action" id="addAdmin">Add as admin</button>
    </div>
    <p class="muted" id="opNote">They must have signed in to Tayka at least once,
      which is when their username exists. New operators start as admins.</p>

    <h2>What an admin cannot do</h2>
    <p class="muted">Read the backups, and see or change this screen. Everything
      else an operator can do, an admin can do: reports, suspensions, removing
      content, broadcasts, prompt overrides, browsing Tayks, premium and usage.</p>`;

  const note = document.getElementById("opNote");
  const say = (msg, bad) => {
    note.textContent = msg;
    note.className = bad ? "note" : "muted";
  };

  const run = async (fn, args, verb) => {
    try {
      const msg = await rpc(fn, args);
      say(typeof msg === "string" ? msg : `${verb} done.`);
      await renderOperators();
    } catch (e) { say(e.message, true); }
  };

  document.getElementById("addAdmin").onclick = () => {
    const name = document.getElementById("newAdmin").value.trim();
    if (!name) { say("Type a username first.", true); return; }
    run("add_admin", { p_username: name }, "Added");
  };
  main.querySelectorAll("[data-role]").forEach(b => b.onclick = () =>
    run("set_admin_role", { p_username: b.dataset.user, p_role: b.dataset.role }, "Changed"));
  main.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => {
    if (!confirm(`Remove @${b.dataset.remove} as an operator?`)) return;
    run("remove_admin", { p_username: b.dataset.remove }, "Removed");
  });
}

const TABS = { home: renderHome, reports: renderReports, prompts: renderPrompts,
               push: renderPush, inbox: renderInbox, accounts: renderPremium,
               //  The old name still routes: #premium is a link somebody may
               //  have kept, and a dead hash lands them on Home with no
               //  explanation. One line is cheaper than that.
               premium: renderPremium,
               content: renderContent, backups: renderBackups,
               usage: renderUsage, operators: renderOperators };

//  Two tabs an admin does not get. The server refuses every call behind them
//  whatever the nav says, so this is what the operator SEES rather than what
//  they may do - the same relationship AdminStore.isAdmin has to is_admin().
const OWNER_ONLY = new Set(["backups", "operators"]);

//  Tabs are history entries, so Back means "the tab I was on" rather than
//  "leave the console". Without this the first Back left the page entirely
//  and landed on the OAuth redirect, which re-renders the sign-in screen --
//  so the browser's most-used control appeared to sign the operator out.
//
//  replaceState for the tab you are already on, pushState for a move: opening
//  Home, Reports, Home should be two entries, not three, or Back walks a
//  history of somewhere you never went.
function go(tab, opts = {}) {
  if (!TABS[tab]) tab = "home";
  //  This tab was called Premium before it grew suspension. The old name still
  //  routes, in TABS, so a kept link is not a dead end - but it is normalised
  //  here so the nav highlights the right button and the URL reads true rather
  //  than leaving somebody on a screen no tab appears to be selected for.
  if (tab === "premium") tab = "accounts";
  nav.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.tab === tab)));

  if (!opts.fromHistory) {
    const at = new URL(window.location.href);
    at.hash = tab;
    if (currentTab === tab) history.replaceState({ tab }, "", at);
    else                    history.pushState({ tab }, "", at);
  }
  currentTab = tab;
  TABS[tab]();
}

let currentTab = null;

nav.addEventListener("click", async (e) => {
  const tab = e.target.dataset?.tab;
  if (!tab) return;
  if (tab === "signout") { await sb.auth.signOut(); renderSignIn(); return; }
  go(tab);
});

//  The wordmark means "home", and home is a different place depending on who
//  is looking. An operator is already in the console, so it is the Home tab -
//  which every operator has, owner or not, so this needs no second check.
//  Anybody else, signed out or signed in without operator rights, is on a page
//  with nothing for them, so home is the public site.
document.getElementById("home-link").addEventListener("click", () => {
  if (isOperator) { go("home"); return; }
  window.location.href = "../";
});

window.addEventListener("popstate", (e) => {
  //  Only steer when signed in. Popping back to the sign-in screen is a real
  //  destination for somebody who has just signed out.
  if (nav.hidden) return;
  const tab = e.state?.tab || (window.location.hash || "").replace(/^#/, "") || "home";
  go(tab, { fromHistory: true });
});

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderSignIn(); return; }

  let admin = false;
  try { admin = await rpc("is_admin"); }
  catch { /* not signed in far enough to ask; treated as not an admin */ }

  if (!admin) { renderNotAdmin(); return; }

  //  Owner is a second, narrower question, and it is asked separately rather
  //  than inferred: is_admin() is deliberately unchanged by 115, so an owner
  //  answers true to both and every ordinary gate keeps working. A failure to
  //  answer is treated as "not an owner", which hides two tabs and refuses
  //  nothing the server would have allowed - the safe direction.
  let owner = false;
  try { owner = await rpc("is_owner"); } catch { owner = false; }

  isOperator = true;
  nav.hidden = false;
  nav.querySelectorAll("[data-tab]").forEach(b => {
    if (OWNER_ONLY.has(b.dataset.tab)) b.hidden = !owner;
  });
  who.textContent = (session.user.email ?? "") + (owner ? " · owner" : " · admin");

  //  Sign-in comes back through an OAuth redirect whose hash carries the
  //  token, not a tab. Anything that is not a known tab means Home.
  const asked = (window.location.hash || "").replace(/^#/, "");
  //  A hash is a way in that does not go past the nav, so it is checked here
  //  too. The server refuses these calls regardless; this is what stops an
  //  admin landing on a screen of errors and thinking the console is broken.
  const allowed = TABS[asked] && (owner || !OWNER_ONLY.has(asked));
  go(allowed ? asked : "home");
}

sb.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_IN" || event === "SIGNED_OUT") boot();
});

boot();
</script>
</body>
</html>
