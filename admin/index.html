<!DOCTYPE html>
<html lang="en">
<!--
  Tayka operator console.  https://tayka.app/admin/

  WHY THIS IS A PATH AND NOT admin.tayka.app
  ------------------------------------------
  GitHub Pages allows ONE custom domain per repository, and this repo's CNAME
  binds tayka.app. A subdomain therefore needs its own repo with its own CNAME
  plus a DNS record, which is more moving parts than the panel is worth on day
  one.

  MIGRATING TO admin.tayka.app LATER
  ----------------------------------
  Nothing here assumes the path, so the move is mechanical:

    1. New public repo, e.g. Tayka-Pic/tayka-admin, containing this directory's
       contents at its root, with a CNAME file holding: admin.tayka.app
    2. In Cloudflare, a CNAME record  admin -> tayka-pic.github.io,
       DNS ONLY (grey cloud). Behind the proxy GitHub sees Cloudflare rather
       than the domain and the certificate never issues - and .app is on the
       HSTS preload list, so the site would not degrade to HTTP, it would fail
       to open at all. Same trap CLAUDE.md records for the apex.
    3. Add https://admin.tayka.app/ to Supabase -> Authentication -> URL
       Configuration -> Redirect URLs.
    4. Leave a redirect stub here. A URL somebody has bookmarked should not
       simply stop working, which is the same reasoning that turned
       docs/privacy.html into a stub rather than deleting it.

  Note what does NOT change: the Apple Services ID. Its registered domain is
  the SUPABASE project's domain, not Tayka's, because the OAuth return URL is
  Supabase's /auth/v1/callback. Apple never redirects to this page directly -
  Supabase does, after it has handled the callback - so where this page lives
  is invisible to Apple.

  The only path-shaped thing in this file is REDIRECT_TO below, and it is
  computed from window.location rather than written down.

  WHAT PROTECTS THIS PAGE
  -----------------------
  Not obscurity, and not the login. Every call below is an RPC whose first line
  is `if not public.is_admin() then raise`. A signed-in non-admin gets an empty
  console and a wall of 42501s; a signed-out visitor gets nothing at all. The
  publishable key in this file is the same one compiled into the app and is
  meant to be public. Do not ever put the service_role key here.
-->
<head>
<meta charset="utf-8">
<!--  viewport-fit=cover so the page paints under the notch and the home
      indicator; the safe-area padding below keeps content out from under
      them. Without both, a standalone web app has a white strip at the top. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tayka Admin</title>

<!--  Add to Home Screen. The manifest is what modern iOS reads; the two
      apple- meta tags are the older mechanism and still the ones that decide
      the status bar, so both are here. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tayka Admin">
<!--  black-translucent, so the status bar sits over the page's own dark
      ground rather than over a white bar of its own. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090f">
<style>
  /* Theme.Share, the app's one fixed palette. This screen is operator
     furniture and never follows the accent. */
  :root {
    --ground:    #08090f;
    --panel:     #131725;
    --hairline:  #232b42;
    --text:      #ffffff;
    --secondary: #9da8c1;
    --accent:    #0096ff;
    --on-accent: #0b121b;
    --danger:    #ff6b6b;
    --good:      #4ec9a0;
  }
  * { box-sizing: border-box; }
  /*  A `display` rule beats the user-agent stylesheet's `[hidden]{display:none}`,
      so `nav { display: flex }` quietly made `nav.hidden = true` do nothing and
      the signed-out screen offered Reports, Premium and Sign out. Caught by
      looking at the page, which is the only way this kind of thing is caught. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--ground); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    /*  The extra top padding is the notch. In a browser tab env() is 0 and
        this is an ordinary 18px, so one rule covers both. */
    padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
    border-bottom: 1px solid var(--hairline);
    position: sticky; top: 0; background: var(--ground); z-index: 10;
  }
  /*  A link, not a label. Clicking the wordmark is the oldest convention on
      the web and it did nothing here, which reads as the page being broken.
      Keeps the wordmark's exact look: colour inherited, no underline. */
  .wordmark {
    font-weight: 900; letter-spacing: 0.23em; font-size: 15px;
    color: inherit; text-decoration: none; cursor: pointer;
    background: none; border: 0; padding: 0; font-family: inherit;
  }
  .wordmark:hover { opacity: 0.75; }
  .wordmark:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  nav button {
    background: none; border: 0; color: var(--secondary); cursor: pointer;
    font: inherit; padding: 6px 10px; border-radius: 8px;
  }
  nav button[aria-current="true"] { background: var(--panel); color: var(--text); }
  main {
    max-width: 860px; margin: 0 auto;
    /*  The bottom pad clears the home indicator, and is generous besides:
        the last row of a queue should not sit against the edge of the glass. */
    padding: 24px max(20px, env(safe-area-inset-left)) calc(80px + env(safe-area-inset-bottom));
  }
  .card {
    background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  h2 { font-size: 15px; margin: 26px 0 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary); }
  button.action {
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px;
    padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.quiet { background: none; color: var(--accent); border: 0; font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0; }
  button.danger { background: none; color: var(--danger); border: 0; font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0; }
  button:disabled { opacity: .45; cursor: default; }
  input, textarea {
    background: var(--ground); color: var(--text); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 10px 12px; font: inherit; width: 100%;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tag {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    padding: 3px 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  }
  .tag.grey { background: var(--secondary); }
  .tag.red  { background: var(--danger); }
  .muted { color: var(--secondary); font-size: 13px; }
  /*  A Tayk is 1440px on its long edge and portrait more often than not, so
      without a height cap one photo is several screens of scrolling and the
      comments under it are unreachable. Shared with the Reports queue, which
      has the same problem for the same reason.  */
  .shot { max-width: 100%; max-height: 70vh; width: auto; border-radius: 10px;
          margin: 10px 0; display: block; }
  .subnav { display: flex; gap: 4px; margin: 0 0 14px; flex-wrap: wrap; }
  .subnav button {
    background: none; border: 1px solid var(--hairline); color: var(--secondary);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .subnav button[aria-current="true"] { background: var(--panel); color: var(--text); border-color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px;
          overflow: hidden; text-align: left; padding: 0; cursor: pointer; color: inherit; font: inherit;
          display: flex; flex-direction: column; }
  /*  The grid stretches every tile to the tallest, so without this the meta
      blocks float at different heights and the row reads as misaligned.  */
  .tile .meta { margin-top: auto; }
  .tile:hover { border-color: var(--accent); }
  .tile .ph { aspect-ratio: 4/5; background: var(--ground); display: grid; place-items: center;
              color: var(--secondary); font-size: 12px; }
  /*  `:not(.face)` matters: a tile holds a Tayk AND, in its byline, a 22px
      avatar. `.tile img` is more specific than `.face`, so without this the
      face inherits width:100% and aspect-ratio 4/5 and renders as a wide
      blue slab across the metadata.  */
  .tile img:not(.face) { width: 100%; max-width: 100%; max-height: none; aspect-ratio: 4/5;
              object-fit: cover; display: block; margin: 0; border-radius: 0; }
  .tile .meta { padding: 8px 10px; font-size: 12px; line-height: 1.45; }
  .tile .meta b { color: var(--text); }
  /*  Looking at somebody's photograph is recorded. The screen says so, always,
      and not in a footnote -- an operator who does not know it is logged is an
      operator the log cannot deter.  */
  /*  A face beside a name. Deliberately small: it is for recognition at a
      glance, not a profile picture, and it must not out-weigh the username
      it sits next to.  */
  /*  Sized with !important because this element lives inside containers that
      style their own images -- a tile, a card, a table cell -- and every one
      of those selectors out-specifies a bare class. The alternative is
      remembering to exclude .face from each of them for ever.  */
  .face {
    width: 22px !important; height: 22px !important; aspect-ratio: 1 !important;
    max-width: 22px !important; max-height: 22px !important;
    border-radius: 50%; object-fit: cover;
    background: var(--ground); flex: 0 0 auto; vertical-align: -6px;
    display: inline-block; border: 1px solid var(--hairline);
  }
  .face.blank { background: var(--ground); }
  .lognote { color: var(--secondary); font-size: 12px; margin: 0 0 12px;
             border-left: 2px solid var(--accent); padding-left: 10px; }
  .empty { color: var(--secondary); padding: 8px 0; }
  .note { color: var(--danger); }
  .center { text-align: center; padding: 60px 20px; }
  table { width: 100%; border-collapse: collapse; }
  .cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .cell {
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 10px 12px; cursor: pointer; text-align: left; color: inherit; font: inherit;
  }
  .cell:hover { border-color: var(--accent); }
  .cell.today  { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cell.past   { opacity: .55; }
  .cell .when  { font-size: 11px; letter-spacing: .06em; color: var(--secondary); text-transform: uppercase; }
  .cell .what  { margin-top: 4px; }
  .cell .edited { font-size: 11px; color: var(--accent); font-weight: 700; }
  .cell .rate  { font-size: 11px; color: var(--secondary); margin-top: 4px; }
  .cell .rate b { color: var(--text); }
  .bars { display: grid; gap: 2px; margin-top: 6px; }
  .bar  { display: grid; grid-template-columns: 10px 1fr 22px; gap: 6px; align-items: center;
          font-size: 10px; color: var(--secondary); }
  .bar span.fill { display: block; height: 5px; border-radius: 999px; background: var(--accent); }
  .bar span.none { display: block; height: 5px; border-radius: 999px; background: var(--hairline); }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .stat {
    background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 12px 14px;
    text-align: left; color: inherit; font: inherit; width: 100%;
  }
  button.stat { cursor: pointer; }
  button.stat:hover { border-color: var(--accent); }
  button.stat[aria-expanded="true"] { border-color: var(--accent); }
  .stat .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .stat .n small { font-size: 15px; color: var(--secondary); font-weight: 400; }
  .stat .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--secondary); margin-top: 2px; }
  .stat.alert .n { color: var(--danger); }

  .widgets { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .widget {
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 14px; text-align: left; color: inherit; font: inherit; cursor: pointer;
  }
  .widget:hover { border-color: var(--accent); }
  /*  The backup alarm. Deliberately loud: the failure it exists to catch ran
      for five days behind a panel that showed a stale date in plain text.  */
  .alarm {
    border: 1px solid var(--danger); border-left-width: 4px; border-radius: 10px;
    background: rgba(255,107,107,0.08); padding: 12px 14px; margin: 0 0 18px;
  }
  .alarm h3 { margin: 0 0 4px; font-size: 15px; color: var(--danger); }
  .alarm .sub { color: var(--secondary); font-size: 13px; }
  .widget.bad { border-color: var(--danger); }
  .widget.bad h3 { color: var(--danger); }
  .widget h3 { margin: 0 0 4px; font-size: 15px; }
  .widget .sub { color: var(--secondary); font-size: 13px; }
  .preview {
    background: var(--ground); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 12px 14px; margin: 8px 0;
  }
  .preview .lead { color: var(--secondary); font-size: 13px; }
  .preview .line { font-size: 17px; font-weight: 600; margin-top: 2px; }
  td { padding: 8px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
</style>
</head>
<body>

<header>
  <button type="button" class="wordmark" id="home-link" aria-label="Tayka home">TAYKA</button>
  <span class="muted" id="who"></span>
  <nav id="nav" hidden>
    <button data-tab="home" aria-current="true">Home</button>
    <button data-tab="reports">Reports</button>
    <button data-tab="content">Content</button>
    <button data-tab="prompts">Prompts</button>
    <button data-tab="push">Push</button>
    <button data-tab="inbox">Inbox</button>
    <button data-tab="accounts">Accounts</button>
    <button data-tab="usage">Usage</button>
    <button data-tab="backups">Backups</button>
    <button data-tab="operators">Operators</button>
    <button data-tab="signout">Sign out</button>
  </nav>
</header>

<main id="main">
  <div class="center muted">Loading…</div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

//  The same values the app compiles in and the suggestions form already
//  inlines. Publishable by design; RLS is what enforces anything.
const SUPABASE_URL = "https://tvxzrvrevpxjwvzfuhom.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_54Y1iL6XfdJ8tFE_2kjB5A_3DqOqIe0";

//  Computed, not written down, so moving this to admin.tayka.app changes
//  nothing in here.
const REDIRECT_TO = window.location.origin + window.location.pathname;

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

//  `PromptProvider.lead` in the app. Every prompt is drawn as "<lead> <prompt>",
//  so the preview below has to use the same words or it is not a preview.
const PROMPT_LEAD = "Tayka pic of";
const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const who  = document.getElementById("who");

//  Whether the person looking at this page is an operator at all, which is the
//  server's answer from `is_admin()` and not a guess from what is on screen.
//  Distinct from `owner` in boot(), which is the narrower second question.
//
//  It exists because the wordmark has two correct destinations and `nav.hidden`
//  cannot tell them apart: a signed-in NON-operator was shown the nav too, so
//  keying on it would send somebody who is not an operator to the operator's
//  home tab. Set in exactly the three places that settle the question.
let isOperator = false;

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const day = (iso) => iso ? new Date(iso).toLocaleDateString(undefined,
  { month: "short", day: "numeric" }) : "";

//  Every call is bounded. supabase-js has NO default timeout, so a stalled
//  request waits for ever and the screen keeps saying "Loading…" -- which is
//  a claim that something is still coming, made about a request that has
//  died. That is the same missing-third-state failure as a photo tile
//  spinning behind a file that will never arrive.
//
//  It is not hypothetical. PostgREST reloads its schema cache whenever a
//  function is created or dropped, and requests stall while it does; the
//  Inbox was seen saying "Loading…" for over a minute during a migration.
//  Nothing was broken and nothing said so. Now it says so.
const RPC_TIMEOUT_MS = 15000;

async function rpc(name, args, opts = {}) {
  const ms = opts.timeout ?? RPC_TIMEOUT_MS;
  let call = sb.rpc(name, args ?? {});

  //  Actually cancel the request where the client supports it, so a timed-out
  //  call stops occupying a connection rather than merely being ignored.
  if (typeof call.abortSignal === "function" && typeof AbortSignal?.timeout === "function") {
    try { call = call.abortSignal(AbortSignal.timeout(ms)); } catch { /* older client */ }
  }

  //  The race is the backstop, for a client that ignores the signal.
  let timer;
  const expiry = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(
      `${name} did not answer within ${Math.round(ms / 1000)} seconds. ` +
      `The server may be busy — try again.`)), ms + 500);
  });

  try {
    const { data, error } = await Promise.race([call, expiry]);
    if (error) {
      //  A request that reached the server as nobody means the session is
      //  gone: the token expired and could not be refreshed, or the tab
      //  outlived a sign-out elsewhere. Every 30 seconds the Home counts
      //  asked again and were refused again - 232 times in one evening -
      //  under a page that still looked signed in. Stop asking and go back
      //  to the door.
      const asNobody = error.code === "PGRST301"
        || /^permission denied for function/.test(error.message ?? "");
      if (asNobody) {
        clearInterval(homeTimer);
        await sb.auth.signOut().catch(() => {});
        renderSignIn("Your session ended. Sign in again.");
      }
      throw error;
    }
    return data;
  } finally {
    clearTimeout(timer);
  }
}

//  An error with a way out of it. A dead end that says "NetworkError" and
//  nothing else leaves reloading the whole page as the only move.
function errorWithRetry(box, message, retry) {
  box.innerHTML = `<p class="note">${esc(message)}</p>`;
  if (!retry) return;
  const b = document.createElement("button");
  b.className = "quiet";
  b.textContent = "Try again";
  b.onclick = retry;
  box.appendChild(b);
}

// ---------------------------------------------------------------------------
//  Sign in
// ---------------------------------------------------------------------------
//  Sign in with Apple, because it is the app's only identity. Apple's `sub` is
//  stable per Apple ID per developer team, so signing in here lands on the
//  SAME auth.users row as the phone - which is what makes is_admin() work
//  without any linking step.

function renderSignIn(message) {
  isOperator = false;
  nav.hidden = true;
  who.textContent = "";
  main.innerHTML = `
    <div class="center">
      <p class="muted">Operator console.</p>
      ${message ? `<p class="note">${esc(message)}</p>` : ""}
      <p><button class="action" id="in">Sign in with Apple</button></p>
      <p class="muted">Use the same Apple ID as your Tayka account.</p>
    </div>`;
  document.getElementById("in").onclick = async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: "apple",
      options: { redirectTo: REDIRECT_TO },
    });
    if (error) renderSignIn(error.message);
  };
}

function renderNotAdmin() {
  isOperator = false;
  //  The nav is the OPERATOR's nav, and this account is not one. Showing it
  //  offered Reports, Content, Push and the rest to somebody every one of
  //  those RPCs will refuse: controls that look live and do nothing, on the
  //  page that has just finished saying nothing here is available to it. It
  //  was only visible so a non-operator could sign out, so that moves into
  //  the page.
  nav.hidden = true;
  who.textContent = "";
  main.innerHTML = `<div class="center">
    <p>Signed in, but this account is not an operator.</p>
    <p class="muted">Nothing here is available to it. That is the server's
    answer, not this page's.</p>
    <p><button class="action" id="not-admin-out">Sign out</button></p>
    <p class="muted"><a href="../">Back to tayka.app</a></p>
  </div>`;
  document.getElementById("not-admin-out").onclick = async () => {
    await sb.auth.signOut();
    renderSignIn();
  };
}

// ---------------------------------------------------------------------------
//  Home
// ---------------------------------------------------------------------------
//  The front door. It used to open on Reports, which is empty most days and so
//  said nothing about whether anything was working.
//
//  Everything here is counts. `admin_dashboard` deliberately returns no
//  per-user data: "38 of 41 posted today" is an operator's view of the
//  product, and the same fact as a list of names is a surveillance tool.

let homeTimer = null;

//  A BACKGROUND REFRESH MUST NEVER DESTROY THE SCREEN.
//
//  The first version rendered every failure the same way - `main.innerHTML =
//  the error` - which is right for a first load, when there is nothing to
//  lose, and completely wrong for the thirty-second tick. One transient
//  "NetworkError when attempting to fetch resource" and the whole console was
//  replaced by a line of red text until the next tick happened to succeed.
//
//  That is the same family as the feed's own rules: a cancelled request is not
//  a failed one, and a spinner is a claim that something is still coming. Here
//  the claim being made falsely was "there is nothing to show you".
//
//  So a refresh that fails leaves what is on screen alone and says so quietly.
//  Only a load with nothing behind it may take the page.
//  How the footer reports on a background poll.
//
//  It used to turn red the instant one refresh failed and stay red, under
//  figures that were perfectly good. A permanent red line beneath working
//  numbers says the panel is broken when it is not, and an operator who
//  learns to ignore it will ignore the one that matters -- the same reason
//  the Sync Daemon row on the backup box was replaced when it had been
//  reading "Inactive" since the day cron was retired.
//
//  So: normally it says when the figures are from. A stumble or two is
//  invisible, because a 30-second poll missing once is not news. Only a run
//  of failures is worth colouring, and by then the timestamp says how stale
//  the numbers actually are, which is the thing an operator needs to know.
let homeRefreshFailures = 0;
let homeLastUpdated = null;
let homeLastFailure = null;

const REFRESH_FAILURES_BEFORE_ALARM = 3;

function homeFooter() {
  const note = document.getElementById("homeNote");
  if (!note) return;

  const at = homeLastUpdated
    ? homeLastUpdated.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })
    : null;

  if (homeRefreshFailures >= REFRESH_FAILURES_BEFORE_ALARM) {
    note.textContent = at
      ? `Not refreshing. These figures are from ${at}.`
      : "Not refreshing.";
    note.className = "note";
    //  The reason, on hover. The message used to be thrown away on a refresh
    //  failure, which left "couldn't refresh" as the only evidence there was
    //  and nothing to diagnose it with. The database answers these in 35ms,
    //  so when this fires the cause is almost always between here and there.
    note.title = homeLastFailure
      ? `${homeRefreshFailures} failed attempts. Last: ${homeLastFailure}`
      : "";
    return;
  }
  note.title = "";

  note.textContent = at
    ? `Updated ${at}. Refreshes every 30 seconds.`
    : "Counts refresh every 30 seconds.";
  note.className = "muted";
}

function homeError(message, isRefresh) {
  if (isRefresh) {
    homeRefreshFailures += 1;
    homeLastFailure = message;
    homeFooter();
    return;
  }
  //  A FIRST load that fails has nothing behind it, so it is the whole screen.
  main.innerHTML = `<p class="note">${esc(message)}</p>`;
  const box = document.createElement("div");
  main.appendChild(box);
  errorWithRetry(box, "", () => renderHome());
}

//  A tile is a button when there is a list behind it, and a plain div when
//  there is not - so "nothing happens" is never a thing the operator has to
//  discover by tapping. `push devices` has no list on purpose: a page of APNs
//  tokens tells nobody anything.
function stat(n, label, opts = {}) {
  const cls = `stat ${opts.alert && n > 0 ? "alert" : ""}`;
  const inner = `<div class="n">${esc(n)}${opts.of !== undefined ? ` <small>of ${esc(opts.of)}</small>` : ""}</div>
    <div class="k">${esc(label)}</div>`;
  return opts.kind
    ? `<button class="${cls}" data-detail="${esc(opts.kind)}" data-title="${esc(label)}"
               aria-expanded="false">${inner}</button>`
    : `<div class="${cls}">${inner}</div>`;
}

//  The rows behind a number, fetched only when somebody asks for them.
//  `admin_dashboard` stays counts-only; this is the deliberate exception, and
//  making it a tap is what keeps looking at a list of people a decision rather
//  than something the screen does on its own every thirty seconds.
async function showDetail(kind, title, button) {
  const box = document.getElementById("detail");
  if (!box) return;

  const already = button.getAttribute("aria-expanded") === "true";
  document.querySelectorAll("button.stat").forEach(b =>
    b.setAttribute("aria-expanded", "false"));
  if (already) { box.innerHTML = ""; return; }
  button.setAttribute("aria-expanded", "true");

  box.innerHTML = `<p class="muted">Loading…</p>`;
  let rows;
  try { rows = await rpc("admin_dashboard_detail", { p_kind: kind }); }
  catch (e) { box.innerHTML = `<p class="note">${esc(e.message)}</p>`; return; }

  if (!rows.length) {
    box.innerHTML = `<div class="card"><p class="empty">Nothing to show for ${esc(title)}.</p></div>`;
    return;
  }

  //  Every kind but pending_pushes is a list of people, and that one returns
  //  null -- so no branch is a special case here, it just draws blank.
  await signFaces(rows.map(r => r.avatar_path));

  box.innerHTML = `<div class="card">
    <div class="row"><strong>${esc(title)}</strong>
      <span class="muted" style="margin-left:auto">${rows.length}${rows.length === 200 ? "+" : ""}</span></div>
    <table>${rows.map(r => `
      <tr>
        <td>
          <div class="row" style="gap:6px">
            ${face(r.avatar_path, r.label)}
            <span>${esc(r.label)}</span>
          </div>
          ${r.detail ? `<div class="muted">${esc(r.detail)}</div>` : ""}
        </td>
        <td style="text-align:right; white-space:nowrap" class="muted">
          ${esc(when(r.at))}
        </td>
      </tr>`).join("")}</table>
  </div>`;
}

//  Time of day for things that happened today, a date for anything older.
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const sameDay = (new Date() - d) < 86400000;
  return d.toLocaleString(undefined, sameDay
    ? { hour: "numeric", minute: "2-digit" }
    : { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

// ---------------------------------------------------------------------------
//  Backups
// ---------------------------------------------------------------------------
//  The database half of backup.tayka.app once produced 452 consecutive EMPTY
//  dumps over five days and reported success throughout: the daemon logged the
//  failure into journald where nobody looks, and the box's own panel could not
//  represent "broken". Nothing a person opens daily said a word.
//
//  So the rule these two functions exist to enforce is: SILENCE IS BROKEN.
//  `is_stale` comes from the server, computed against the server's clock, and
//  a box that has never reported comes back as one row flagged stale rather
//  than as no rows. Neither of these may ever draw a blank for a bad state.

function backupTrouble(b, err) {
  if (err) return "unreachable";          // we could not ask
  if (!b) return "unreachable";           // the call worked and said nothing
  if (b.is_stale) return "silent";        // the box has stopped reporting
  if (!b.db_healthy) return "failing";    // it is reporting, and it is broken
  return null;
}

function backupAlarm(b, err) {
  const trouble = backupTrouble(b, err);
  if (!trouble) return "";

  //  Built one branch at a time, NOT as an object of all three. An object
  //  evaluates every arm, so the `failing` text dereferenced a beat that is
  //  null in the `unreachable` case -- and the throw landed in renderHome with
  //  nothing to catch it, blanking the whole page at the exact moment the
  //  backup could not be reached. The alarm must not be the thing that breaks.
  let lines;
  if (trouble === "unreachable") {
    lines = [
      "Backup status could not be read",
      err ? esc(err) : "The console asked and got nothing back. Check backup.tayka.app directly.",
    ];
  } else if (trouble === "silent") {
    lines = [
      "The backup has stopped reporting",
      b && b.at
        ? `Last heard from ${esc(fmtWhen(b.at))} (${esc(b.age_minutes)} minutes ago). The box may be off, offline, or the sync daemon may have died.`
        : "It has never reported. Nothing is known to be backed up.",
    ];
  } else {
    const n = b.db_consecutive_failures ?? 0;
    lines = [
      "The backup is running and failing",
      `${esc(n)} database backup${n === 1 ? "" : "s"} in a row produced nothing.` +
      (b.last_db_backup ? ` The last usable one was ${esc(fmtWhen(b.last_db_backup))}.`
                        : " There is no usable backup at all."),
    ];
  }

  return `<div class="alarm">
    <h3>${lines[0]}</h3>
    <div class="sub">${lines[1]}</div>
  </div>`;
}

function backupWidget(b, err) {
  //  An admin sees no backup card at all. It would be a widget reporting on
  //  something they cannot open, and its alarm state would be an emergency
  //  they cannot act on.
  if (!nav.querySelector('[data-tab="backups"]') ||
      nav.querySelector('[data-tab="backups"]').hidden) return "";
  const trouble = backupTrouble(b, err);
  const cls = trouble ? "widget bad" : "widget";

  //  A button now. This said "there is nowhere in this console to go", which
  //  was true until the Backups tab existed and was the whole complaint: the
  //  card carries a file count, and the questions an operator actually has --
  //  is the last dump usable, how old is the encrypted copy, has it been
  //  failing quietly -- were all one RPC away and unreachable.
  if (trouble === "unreachable")
    return `<button class="${cls}" data-go="backups"><h3>Backups</h3>
      <div class="sub">status unavailable</div></button>`;

  if (trouble === "silent")
    return `<button class="${cls}" data-go="backups"><h3>Backups · silent</h3>
      <div class="sub">${b && b.at ? `last beat ${esc(b.age_minutes)} min ago` : "never reported"}</div></button>`;

  if (trouble === "failing")
    return `<button class="${cls}" data-go="backups"><h3>Backups · failing</h3>
      <div class="sub">${esc(b.db_consecutive_failures)} empty in a row</div></button>`;

  return `<button class="${cls}" data-go="backups"><h3>Backups</h3>
    <div class="sub">${esc(b.database_backups_ok ?? "?")} usable · ${esc(b.storage_files ?? "?")} files ·
      ${esc(Math.round((b.database_size_mb ?? 0) + (b.storage_size_mb ?? 0)))} MB</div></button>`;
}

function fmtWhen(iso) {
  try { return new Date(iso).toLocaleString(); } catch { return iso; }
}

async function renderHome(isRefresh = false) {
  if (!isRefresh && !main.querySelector(".stats")) {
    main.innerHTML = `<div class="muted">Loading…</div>`;
  }

  let d, todayRating = null;
  try {
    //  Two calls, and the second genuinely has to wait: it needs today's day
    //  index, which the first returns. `admin_dashboard` predates ratings and
    //  widening it would mean editing a migration that is already applied.
    d = (await rpc("admin_dashboard"))[0];
    const rated = await rpc("prompt_rating_summary", { p_from: d.today_index, p_days: 1 });
    todayRating = rated?.[0] ?? null;
  } catch (e) { homeError(e.message, isRefresh); return; }

  //  Backup status is fetched separately and is NEVER allowed to take the home
  //  page down with it. The console has already had that bug once: a failing
  //  refresh wrote its error over the whole panel. A widget that cannot load
  //  is its own third state and says so.
  let backup = null, backupErr = null;
  try {
    backup = (await rpc("backup_status", { p_source: "tayka-backup" }))?.[0] ?? null;
  } catch (e) { backupErr = e.message; }

  main.innerHTML = `
    ${backupAlarm(backup, backupErr)}
    <h2>Today · day ${esc(d.today_index)}</h2>

    </div>

      ${stat(d.posted_today, "posted today", { of: d.total_users, kind: "posted_today" })}
      ${stat(d.posted_yesterday, "posted yesterday", { of: d.total_users, kind: "posted_yesterday" })}
      ${stat(d.new_users_today, "new today", { kind: "new_users_today" })}
      ${stat(d.retayks_today, "retayks today", { kind: "retayks_today" })}
      ${stat(d.comments_today, "comments today", { kind: "comments_today" })}
      ${stat(d.premium_accounts, "premium", { kind: "premium_accounts" })}
      ${stat(d.push_devices, "push devices")}
      ${stat(d.suspended_accounts, "suspended", { alert: true, kind: "suspended_accounts" })}
    </div>
    <div id="detail"></div>

    <h2>Queues</h2>
    <div class="widgets">
      <button class="widget" data-go="reports">
        <h3>Reports ${d.open_reports ? `· ${d.open_reports}` : ""}</h3>
        <div class="sub">${d.open_reports ? "waiting on you" : "nothing to review"}</div>
      </button>
      <button class="widget" data-go="inbox">
        <h3>Inbox ${d.feedback_waiting + d.suggestions_waiting || ""}</h3>
        <div class="sub">${esc(d.feedback_waiting)} bug/idea · ${esc(d.suggestions_waiting)} prompt</div>
      </button>
      <button class="widget" data-go="push">
        <h3>Push ${d.pending_pushes ? `· ${d.pending_pushes}` : ""}</h3>
        <div class="sub">${d.pending_pushes ? "scheduled and waiting" : "nothing scheduled"}</div>
      </button>
      <button class="widget" data-go="prompts">
        <h3>Prompts</h3>
        <div class="sub">calendar and overrides</div>
      </button>

      </button>
      ${backupWidget(backup, backupErr)}

    <p class="muted" id="homeNote">Counts refresh every 30 seconds.</p>`;

  //  Reached only when every fetch above succeeded, so this is the honest
  //  moment to call the figures current.
  homeRefreshFailures = 0;
  homeLastUpdated = new Date();
  homeFooter();

  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  main.querySelectorAll("[data-detail]").forEach(b => b.onclick = () =>

  //  It also skips a tick while the page is hidden. A backgrounded tab or a

  clearInterval(homeTimer);

    //  smaller form. Counts resume the moment the list is closed.
    if (document.getElementById("detail")?.innerHTML) return;
    renderHome(true);
  }, 30000);
}

// ---------------------------------------------------------------------------
//  Reports
// ---------------------------------------------------------------------------
//  The photo is the point. Until supabase/83 an operator could not read the
//  bytes of a reported Tayk at all, so this queue was a reason and two
//  usernames about a picture nobody reviewing it could see.

//  `list_reports` has taken include_resolved since 65 and nothing ever passed
//  true, so every handled report vanished. An empty queue then looks exactly
//  like a broken one -- which is how this was reported: "the reports seem to
//  be missing." They were not missing, they were done.
let reportsShowArchive = false;

async function renderReports() {
  const heading = () => `<h2>Reports</h2>
    <div class="subnav" id="rnav">
      <button data-arch="0">Open</button>
      <button data-arch="1">Archive</button>
    </div>`;

  const wireTabs = () => {
    main.querySelectorAll("#rnav button").forEach(b => {
      b.setAttribute("aria-current", String((b.dataset.arch === "1") === reportsShowArchive));
      b.onclick = () => { reportsShowArchive = b.dataset.arch === "1"; renderReports(); };
    });
  };

  main.innerHTML = heading() + `<div class="muted">Loading…</div>`;
  wireTabs();

  let rows;
  try { rows = await rpc("list_reports", { include_resolved: reportsShowArchive }); }
  catch (e) {
    main.innerHTML = heading();
    const box = document.createElement("div");
    main.appendChild(box);
    errorWithRetry(box, e.message, renderReports);
    wireTabs();
    return;
  }

  //  The archive call returns open ones too, so the open list is not repeated
  //  above the history of itself.
  if (reportsShowArchive) rows = rows.filter(r => r.resolved_at);

  if (!rows.length) {
    main.innerHTML = heading() + `<p class="empty">${
      reportsShowArchive ? "Nothing has been resolved yet."
                         : "Nothing to review. Resolved reports are in the archive."}</p>`;
    wireTabs();
    return;
  }

  //  One signing request for the whole page, the same reasoning
  //  PhotoDownloader gives: a page of photos should not be a round trip each.
  //  Faces come from the avatars bucket and are signed separately -- see the
  //  note on signFaces about why they do NOT go through admin-photo.
  await signFaces(rows.flatMap(r => [r.reporter_avatar, r.reported_avatar]));

  const paths = rows.map(r => r.image_path).filter(Boolean);
  const signed = {};
  if (paths.length) {
    const { data } = await sb.storage.from("post-photos").createSignedUrls(paths, 3600);
    (data ?? []).forEach(d => { if (d.signedUrl) signed[d.path] = d.signedUrl; });
  }

  main.innerHTML = heading() + rows.map(r => `
    <div class="card" data-id="${esc(r.id)}">
      <div class="row">
        <span class="tag">${esc(r.target_kind)}</span>
        ${r.suspended ? '<span class="tag red">SUSPENDED</span>'
          : (r.pressure >= 2 ? '<span class="tag red">URGENT</span>' : "")}
        ${r.resolved_at ? `<span class="tag grey">resolved ${esc(day(r.resolved_at))}</span>` : ""}
        <span class="muted" style="margin-left:auto">${esc(day(r.created_at))}</span>
      </div>
      ${r.image_path && signed[r.image_path]
        ? `<img class="shot" src="${esc(signed[r.image_path])}" alt="reported photo">`
        : (r.image_path ? `<p class="muted">Photo unavailable.</p>` : "")}
      ${r.detail ? `<p>${esc(r.detail)}</p>` : ""}
      <p class="muted">${esc(r.reason)}
        ${r.reported ? ` · ${face(r.reported_avatar, r.reported)} @${esc(r.reported)}` : ""}
        ${r.reporter ? ` · reported by ${face(r.reporter_avatar, r.reporter)} @${esc(r.reporter)}` : ""}
        ${r.pressure > 1 ? " · " + r.pressure + " different reporters this week" : ""}</p>
      <div class="row">
        ${r.resolved_at ? "" : `
        <button class="danger" data-act="remove">Remove</button>
        <button class="quiet"  data-act="dismiss">Dismiss</button>`}
        ${r.reported ? `<button class="quiet" data-act="suspend"
           data-user="${esc(r.reported)}" data-on="${r.suspended ? 0 : 24}"
           style="margin-left:auto">${r.suspended ? "Unsuspend" : "Suspend 24h"}</button>` : ""}
      </div>
    </div>`).join("");

  wireTabs();
  wirePhotoFallbacks(main);

  main.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const card = b.closest(".card");
    const act  = b.dataset.act;
    try {
      if (act === "suspend") {
        await rpc("set_suspension", { name: b.dataset.user, hours: Number(b.dataset.on) });
      } else {
        //  Removing deletes content for everyone, so it asks first. Dismissing
        //  changes nothing about the content and does not.
        if (act === "remove" && !confirm("Remove this content for everyone?")) return;
        await rpc("resolve_report", { report: card.dataset.id, action: act });
      }
      renderReports();
    } catch (e) { alert(e.message); }
  });
}

  main.innerHTML = `
    <h2>Accounts</h2>
    <div class="card">
      <div class="row">

      <p class="muted">Wildcards are escaped on the server, so a stray % finds

    </div>

    results.innerHTML = `<div class="card"><table>` + rows.map(r => `
      <tr>
        <td>
          <div class="row">
            ${face(r.avatar_path, r.username)}
            <strong>@${esc(r.username)}</strong>

            ${r.suspended ? '<span class="tag red">SUSPENDED</span>' : ""}
          </div>
          <div class="muted">${esc(r.source ? sourceLabel(r.source) : "joined " + day(r.joined))}</div>
        </td>
        <td style="text-align:right; white-space:nowrap">
          <div>${r.premium && r.source === "purchase"
            ? `<span class="muted">cannot be revoked</span>`
            : `<button class="${r.premium ? "danger" : "quiet"}" data-user="${esc(r.username)}"
                 data-on="${r.premium ? 0 : 1}">${r.premium ? "Make standard" : "Make premium"}</button>`}</div>
          <div><button class="${r.suspended ? "quiet" : "danger"}"
                 data-suspend="${esc(r.username)}" data-hours="${r.suspended ? 0 : 24}"
               >${r.suspended ? "Lift suspension" : "Suspend 24h"}</button></div>
        </td>
      </tr>`).join("") + `</table></div>`;

    results.querySelectorAll("[data-user]").forEach(b => b.onclick = async () => {
      try {
        await rpc("set_premium", { p_username: b.dataset.user, p_on: b.dataset.on === "1" });
        search();
      } catch (e) { alert(e.message); }
    });

    //  Suspension, by hand, for somebody who was not reported through the app.
    //  The console had no way to do this at all: set_suspension was reachable
    //  only from a row in the Reports queue, so an operator who knew a name and
    //  had no report about it could do nothing here.
    //
    //  24 hours is the only length offered. It is what the automatic
    //  three-reporter suspension uses, and 65 argues that a reversible measure
    //  short enough to be wrong cheaply is the whole point. A suspension is a
    //  timestamp rather than a flag: nothing runs when it ends, the comparison
    //  simply stops being true.
    //
    //  Re-searching afterwards rather than assuming, because the badge on the
    //  row has to change and only the server knows whether it did.
    results.querySelectorAll("[data-suspend]").forEach(b => b.onclick = async () => {

      } catch (e) { alert(e.message); }
    });
  };

  document.getElementById("go").onclick = search;
  document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
}

// ---------------------------------------------------------------------------
//  Prompts
// ---------------------------------------------------------------------------
//  The rotation is a pure function frozen by invariant 2, and `prompt_schedule`
//  holds its OUTPUT - generated by running the real Swift, not ported. So this
//  screen shows what every phone will compute, and an override on top of it.
//
//  There is deliberately no copy of the epoch here. The server says which day
//  is today (`tayka_today`), and every other date is derived from the most
//  recent 12:00 UTC drop, which is plain UTC arithmetic with no Tayka constant
//  in it. A fourth copy of the epoch is a fourth thing that can drift.

let todayIndex = null;
let windowFrom = null;
const WINDOW = 28;


function lastDropUTC() {
  const now = new Date();
  const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(),
                              now.getUTCDate(), 12, 0, 0));
  if (d > now) d.setUTCDate(d.getUTCDate() - 1);   // today's drop has not landed
  return d;
}

function dropDate(dayIndex) {
  const d = lastDropUTC();
  d.setUTCDate(d.getUTCDate() + (dayIndex - todayIndex));
  return d;
}

function whenLabel(dayIndex) {
  const delta = dayIndex - todayIndex;
  if (delta === 0)  return "Today";
  if (delta === 1)  return "Tomorrow";
  if (delta === -1) return "Yesterday";
  const d = dropDate(dayIndex);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

async function renderPrompts() {
  if (todayIndex === null) {
    try { todayIndex = await rpc("tayka_today"); }
    catch (e) { main.innerHTML = `<p class="note">${esc(e.message)}</p>`; return; }
  }
  if (windowFrom === null) windowFrom = todayIndex - 7;

  main.innerHTML = `<h2>Prompts</h2><div class="muted">Loading…</div>`;
  let rows, rated = {};
  try {
    //  The calendar and how each day landed, together. A rating is a fact
    //  about a prompt, so it belongs on the prompt rather than behind its own
    //  tab.
    const [cal, ratings] = await Promise.all([
      rpc("prompt_calendar", { p_from: windowFrom, p_days: WINDOW }),
      rpc("prompt_rating_summary", { p_from: windowFrom, p_days: WINDOW }),
    ]);
    rows = cal;
    for (const r of ratings) rated[r.day_index] = r;
  } catch (e) { main.innerHTML = `<p class="note">${esc(e.message)}</p>`; return; }

  const first = rows[0], last = rows[rows.length - 1];
  main.innerHTML = `
    <h2>Prompts</h2>
    <div class="card">
      <div class="row">
        <button class="quiet" id="prev">← earlier</button>
        <span class="muted" style="margin:0 auto">
          ${esc(whenLabel(first.day_index))} – ${esc(whenLabel(last.day_index))}
        </span>
        <button class="quiet" id="next">later →</button>
      </div>
      <div class="row"><button class="quiet" id="now">Back to today</button></div>
    </div>
    <div class="cal">${rows.map(r => `
      <button class="cell ${r.is_today ? "today" : ""} ${r.day_index < todayIndex ? "past" : ""}"
              data-day="${r.day_index}">
        <div class="when">${esc(whenLabel(r.day_index))} · day ${r.day_index}</div>
        <div class="what">${esc(r.effective)}</div>
        ${r.override ? '<div class="edited">EDITED</div>' : ""}
        ${rated[r.day_index]?.votes
          ? `<div class="rate">★ <b>${esc(rated[r.day_index].average)}</b> · ${esc(rated[r.day_index].votes)} rating${rated[r.day_index].votes === 1 ? "" : "s"}</div>`
          : (r.day_index <= todayIndex ? '<div class="rate">no ratings</div>' : "")}
      </button>`).join("")}</div>
    <div id="editor"></div>`;

  document.getElementById("prev").onclick = () => { windowFrom -= WINDOW; renderPrompts(); };
  document.getElementById("next").onclick = () => { windowFrom += WINDOW; renderPrompts(); };
  document.getElementById("now").onclick  = () => { windowFrom = todayIndex - 7; renderPrompts(); };

  main.querySelectorAll(".cell").forEach(b => b.onclick = () => {
    const row = rows.find(r => String(r.day_index) === b.dataset.day);
    openEditor(row, rated[row.day_index]);
  });
}

//  A day already past can still be edited, and that is on purpose: `posts`
//  stores the prompt each Tayk was actually answering, so changing a past day
//  moves only the header the app draws over it. What it must not do is change
//  a day somebody is mid-answer on, which is why the app pins the first
//  settled prompt it shows for a day and picks up an edit on the next launch.
//  The spread, not just the average. 3.0 from everybody shrugging and 3.0
//  from half loving it and half hating it are the same number and completely
//  different findings, and only the second is worth writing more prompts like.
function spreadHTML(r) {
  if (!r || !r.votes) return "";
  const counts = [r.r1, r.r2, r.r3, r.r4, r.r5];
  const peak = Math.max(...counts, 1);
  return `<div class="bars">${counts.map((c, i) => `
    <div class="bar">
      <span>${i + 1}</span>
      <span class="${c ? "fill" : "none"}" style="width:${c ? Math.max(c / peak * 100, 4) : 100}%"></span>
      <span>${c}</span>
    </div>`).join("")}</div>`;
}

function openEditor(row, rating) {
  const box = document.getElementById("editor");
  const past = row.day_index < todayIndex;
  box.innerHTML = `
    <div class="card">

             by ${esc(rating.votes)} ${rating.votes === 1 ? "person" : "people"}</p>
           ${spreadHTML(rating)}`
        : (past ? `<p class="muted">Nobody rated this day.</p>` : "")}
      <p><input id="text" value="${esc(row.effective)}" maxlength="200"></p>
      ${row.is_today ? `<p class="muted">Phones that have already shown today's
        prompt keep it until their next launch. Editing today is for fixing a
        mistake, not for changing the day under people.</p>` : ""}
      ${past ? `<p class="muted">This day is over. Editing it changes the header

      <div class="row">

  if (clear) clear.onclick = async () => {

// ---------------------------------------------------------------------------
//  Push
// ---------------------------------------------------------------------------
//  The only thing in Tayka that reaches every phone in the world without
//  somebody pressing anything at the moment it lands. Sending now and
//  scheduling are the same form with two buttons, because they are the same
//  decision with a different time on it.
//
//  A broadcast writes no notifications rows on purpose - it is an
//  announcement, not a per-user event - so it neither appears in anybody's
//  in-app list nor inflates their unread badge.

//  The <input type="datetime-local"> value is LOCAL wall-clock with no zone,
//  so it is turned into an instant here rather than handed to Postgres as a
//  string. new Date(local) uses the browser's own offset, which is what the
//  operator meant when they typed it.
function localToISO(v) {
  const d = new Date(v);
  return isNaN(d) ? null : d.toISOString();
}

function whenText(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined,
    { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

async function renderPush() {
  main.innerHTML = `
    <h2>Push</h2>
    <div class="card">
      <p><input id="ptitle" placeholder="Title" maxlength="120"></p>
      <p><textarea id="pbody" rows="3" placeholder="Body" maxlength="500"></textarea></p>
      <div class="row">
        <input id="pwhen" type="datetime-local" style="flex:1">
        <button class="quiet" id="schedule">Schedule</button>
        <button class="action" id="now">Send now</button>
      </div>
      <p class="muted" id="pstatus">Every device with notifications on gets this
      banner. It is not added to anyone's notifications list.</p>
    </div>
    <h2>Queue</h2>
    <div id="queue" class="muted">Loading…</div>`;

  const status = document.getElementById("pstatus");
  const title = () => document.getElementById("ptitle").value.trim();
  const body  = () => document.getElementById("pbody").value.trim();

  const say = (msg, bad) => {
    status.textContent = msg;
    status.className = bad ? "note" : "muted";
  };

  //  Sending now is irreversible and reaches everybody, so it asks. Scheduling
  //  does not, because a scheduled push can still be cancelled.
  document.getElementById("now").onclick = async () => {
    if (!title()) { say("A title is required.", true); return; }
    if (!confirm("Send this to every device, right now?")) return;
    try {
      const msg = await rpc("broadcast_push", { p_title: title(), p_body: body() });
      say(msg, false);
    } catch (e) { say(e.message, true); }
  };

  document.getElementById("schedule").onclick = async () => {
    if (!title()) { say("A title is required.", true); return; }
    const when = localToISO(document.getElementById("pwhen").value);
    if (!when) { say("Pick a date and time first.", true); return; }
    try {
      await rpc("schedule_push", { p_title: title(), p_body: body(), p_send_at: when });
      document.getElementById("ptitle").value = "";
      document.getElementById("pbody").value = "";
      say("Scheduled. It can be cancelled until it goes out.", false);
      loadQueue();
    } catch (e) { say(e.message, true); }
  };

  loadQueue();
}

//  What people write in the box and what a prompt actually is are different
//  shapes. Some submissions arrive as "Tayka pic of your desk", some as "pic
//  of your desk", some as just "your desk" - and the app draws every prompt as
//  "<lead> <prompt>", so pasting the first two verbatim produces "Tayka pic of
//  Tayka pic of your desk" on everybody's phone.
//
//  So the lead-in is stripped, the operator is TOLD it was stripped, and the
//  preview shows the finished sentence exactly as a user reads it.
function stripLeadIn(text) {
  const patterns = [
    /^\s*tayka\s+pic\s+of\s+/i,
    /^\s*tayk\s+a\s+pic\s+of\s+/i,
    /^\s*take\s+a\s+pic(ture)?\s+of\s+/i,
    /^\s*a\s+pic(ture)?\s+of\s+/i,
    /^\s*pic(ture)?\s+of\s+/i,
    /^\s*photo\s+of\s+/i,
  ];
  for (const re of patterns) {
    if (re.test(text)) return { text: text.replace(re, "").trim(), stripped: true };
  }
  return { text: text.trim(), stripped: false };
}

//  Nothing is written until Save. The day is chosen explicitly and defaults to
//  three days out, never to today: a prompt set for a day already underway is
//  pinned on every phone that has shown it, and a reminder queued earlier
//  carries the old text.
async function useAsPrompt(raw) {
  const box = document.getElementById("sg");
  const cleaned = stripLeadIn(raw);

  let days = [];
  try { days = await rpc("prompt_calendar", { p_from: todayIndex ?? await rpc("tayka_today"), p_days: 21 }); }
  catch (e) { alert(e.message); return; }
  if (todayIndex === null) { try { todayIndex = await rpc("tayka_today"); } catch {} }

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h3 style="margin:0 0 6px; font-size:15px">Use as a prompt</h3>
    <p class="muted">Submitted as: “${esc(raw)}”</p>
    ${cleaned.stripped ? `<p class="muted">The lead-in was removed, because the
      app adds it. Edit below if that was wrong.</p>` : ""}
    <p><input id="upText" maxlength="200" value="${esc(cleaned.text)}"></p>
    <div class="preview">
      <div class="lead">People will read</div>
      <div class="line" id="upPreview"></div>
    </div>
    <p>
      <select id="upDay">
        ${days.filter(d => d.day_index > (todayIndex ?? 0)).map((d, i) => `
          <option value="${d.day_index}" ${i === 2 ? "selected" : ""}>
            day ${d.day_index} — currently ${esc(d.effective)}${d.override ? " (already edited)" : ""}
          </option>`).join("")}
      </select>
    </p>
    <div class="row">
      <button class="action" id="upSave">Set for that day</button>
      <button class="quiet" id="upCancel" style="margin-left:auto">Cancel</button>
    </div>
    <p class="muted" id="upStatus"></p>`;
  box.prepend(card);
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });

  const field = card.querySelector("#upText");
  const paint = () => {
    card.querySelector("#upPreview").textContent =
      PROMPT_LEAD + " " + (field.value.trim() || "…");
  };
  field.addEventListener("input", paint);
  paint();

  card.querySelector("#upCancel").onclick = () => card.remove();
  card.querySelector("#upSave").onclick = async () => {
    const text = field.value.trim();
    const day = Number(card.querySelector("#upDay").value);
    if (!text) return;
    const current = days.find(d => d.day_index === day);
    if (current?.override &&
        !confirm(`Day ${day} already has an override. Replace it?`)) return;
    try {
      await rpc("set_prompt_override", { p_day: day, p_prompt: text });
      card.querySelector("#upStatus").textContent =
        `Set for day ${day}. It is not cleared from this list automatically.`;
      card.querySelector("#upSave").disabled = true;
    } catch (e) { card.querySelector("#upStatus").textContent = e.message; }
  };
}

// ---------------------------------------------------------------------------
//  Shell

// ---------------------------------------------------------------------------
//  Faces
// ---------------------------------------------------------------------------
//  An avatar next to a username, so an operator can tell two accounts apart
//  without reading them.
//
//  These are signed through ORDINARY storage, NOT through admin-photo, and the
//  difference is deliberate. Avatars are the first exception to the reveal
//  gate and have been since 12_profiles_and_avatars.sql: readable by any
//  signed-in user, because Friends search is a column of blank circles
//  otherwise. So an operator seeing a face reaches past nothing, and routing
//  them through the logging function would fill admin_photo_access with rows
//  about images anybody can already fetch -- drowning the ones that matter.
//  The log is narrow because what it records is narrow.
//
//  One request per page, cached for the session. An avatar path never changes
//  its bytes (each upload writes a new random filename), so a URL is good
//  until it expires and re-signing the same face on every render is waste.
const faceCache = new Map();

async function signFaces(paths) {
  const want = [...new Set(paths.filter(Boolean))].filter(p => !faceCache.has(p));
  if (want.length) {
    try {
      //  Chunked: createSignedUrls takes a list, and a page of 200 rows is a
      //  bigger request than the API wants in one go.
      for (let i = 0; i < want.length; i += 100) {
        const slice = want.slice(i, i + 100);
        const { data } = await sb.storage.from("avatars").createSignedUrls(slice, 3600);
        (data ?? []).forEach(d => { if (d.path) faceCache.set(d.path, d.signedUrl ?? null); });
        //  A path the API declined is remembered as a miss, so the next render
        //  does not ask again and the blank circle is drawn immediately.
        slice.forEach(pth => { if (!faceCache.has(pth)) faceCache.set(pth, null); });
      }
    } catch {
      //  A face is a convenience. Failing to sign one must never take down the
      //  list it decorates, so every path just stays unknown and draws blank.
      want.forEach(pth => faceCache.set(pth, null));
    }
  }
  return faceCache;
}

//  Drawn for EVERY row, with or without a photo: a circle that appears only
//  sometimes makes the column jump and reads as a rendering fault rather than
//  as an account with no picture.
function face(path, alt) {
  const url = path ? faceCache.get(path) : null;
  return url
    ? `<img class="face" src="${esc(url)}" alt="${esc(alt ?? "")}" loading="lazy">`
    : `<span class="face blank" aria-hidden="true"></span>`;
}

// ---------------------------------------------------------------------------
//  Content
// ---------------------------------------------------------------------------
//  Full read access to posts, comments and accounts, and any photo can be
//  opened. That is a deliberate widening -- everything else an operator can do
//  in Tayka is narrow -- and the thing that makes it defensible is that every
//  photo opened is RECORDED, before the URL is issued.
//
//  So two rules shape this screen:
//
//  1. THE LIST IS TEXT AND THE PHOTO IS A TAP. Auto-loading a grid of
//     photographs would write fifty log rows for a glance and make the log
//     useless for answering "who looked at this". It is the same reasoning
//     admin_dashboard_detail already gives about its own drill-down: making it
//     a tap keeps looking at people a decision rather than something the screen
//     does on its own. It also keeps egress down, which is the bill that
//     decides what Tayka costs to run.
//
//  2. THE SCREEN SAYS IT IS LOGGED. Every time. An operator who does not know
//     is an operator the log cannot deter, and deterrence is most of its value.

let contentMode = "posts";
let contentFilters = { day: "", username: "", search: "" };

//  Signing goes through the admin-photo Edge Function, never through
//  createSignedUrls directly: the function writes the access record first and
//  refuses to sign if it cannot. The console could not do that itself, which
//  is the whole reason the function exists.
async function signPhotos(paths, context) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("signed out");

  const r = await fetch(`${SUPABASE_URL}/functions/v1/admin-photo`, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${session.access_token}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ paths, context, bucket: "post-photos" }),
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `signing failed (${r.status})`);
  return body.urls || {};
}

//  A thumbnail is a twentieth of the bytes, and photos posted before the
//  storage policy was fixed have none -- so both paths are signed and the
//  full-size one is the onerror fallback. A miss must never leave a spinner.
const thumbOf = (path) => path.replace(/\.jpg$/, "-t.jpg");

function photoImg(url, fallback, alt) {
  //  A photo that will never arrive must not draw as one that is still coming.
  //  Same rule as PhotoPlaceholder in the app: the missing third state gets its
  //  own picture, never a spinner and never an empty box.
  if (!url) return `<div class="ph">unavailable</div>`;
  //  The fallback URL travels in a data attribute rather than inside an inline
  //  onerror. A signed URL is long, contains & and =, and building executable
  //  JavaScript around it by string concatenation is a quoting bug waiting for
  //  the one URL that has the wrong character in it.
  //  `shot` is what caps the size. Without it a Tayk renders at its natural
  //  1440px and drives straight through the card and off the page -- which is
  //  invisible in a fixture with small images and obvious with a real one.
  //  `.tiles img` overrides the cap inside a grid tile, so one class serves both.
  return `<img src="${esc(url)}" alt="${esc(alt)}" class="shot needsFallback"` +
         (fallback ? ` data-fallback="${esc(fallback)}"` : "") + `>`;
}

//  Called after any innerHTML that may contain photoImg output.
function wirePhotoFallbacks(root) {
  root.querySelectorAll("img.needsFallback").forEach(img => {
    img.classList.remove("needsFallback");
    img.addEventListener("error", () => {
      const fb = img.dataset.fallback;
      if (fb && !img.dataset.triedFallback) {
        img.dataset.triedFallback = "1";
        img.src = fb;
        return;
      }
      const div = document.createElement("div");
      div.className = "ph";
      div.textContent = "unavailable";
      img.replaceWith(div);
    });
  });
}

async function renderContent() {
  main.innerHTML = `
    <div class="subnav" id="cnav">
      <button data-mode="posts">Tayks</button>
      <button data-mode="comments">Comments</button>
      <button data-mode="people">People</button>
      <button data-mode="access">Access log</button>
    </div>
    <div id="cfilters"></div>
    <div id="cbody"><p class="muted">Loading…</p></div>`;

  main.querySelectorAll("#cnav button").forEach(b => {
    b.setAttribute("aria-current", String(b.dataset.mode === contentMode));
    b.onclick = () => { contentMode = b.dataset.mode; renderContent(); };
  });

  const filters = document.getElementById("cfilters");
  const body = document.getElementById("cbody");

  try {
    if (contentMode === "posts")    await contentPosts(filters, body);
    if (contentMode === "comments") await contentComments(filters, body);
    if (contentMode === "people")   await contentPeople(filters, body);
    if (contentMode === "access")   await contentAccess(filters, body);
  } catch (e) {
    body.innerHTML = `<p class="note">${esc(e.message)}</p>`;
  }
}

function filterBar(fields, onApply) {
  return `<div class="row" style="margin-bottom:12px">
    ${fields.map(f => `<input id="${f.id}" placeholder="${esc(f.ph)}"
        value="${esc(f.value ?? "")}" style="max-width:${f.w || 170}px">`).join("")}
    <button id="applyBtn">Search</button>
    <button class="quiet" id="clearBtn">Clear</button>
  </div>`;
}

function wireFilters(ids, apply) {
  const run = () => {
    ids.forEach(id => contentFilters[id] = document.getElementById(id)?.value.trim() ?? "");
    apply();
  };
  document.getElementById("applyBtn").onclick = run;
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onkeydown = (e) => { if (e.key === "Enter") run(); };
  });
  document.getElementById("clearBtn").onclick = () => {
    ids.forEach(id => contentFilters[id] = "");
    apply();
  };
}

async function contentPosts(filters, body) {
  filters.innerHTML = filterBar([
    { id: "day", ph: "day index", value: contentFilters.day, w: 110 },
    { id: "username", ph: "username", value: contentFilters.username },
  ]);
  wireFilters(["day", "username"], renderContent);

  const rows = await rpc("admin_browse_posts", {
    p_day: contentFilters.day ? Number(contentFilters.day) : null,
    p_username: contentFilters.username || null,
    p_limit: 24, p_offset: 0,
  });
  await signFaces(rows.map(r => r.avatar_path));

  if (!rows.length) { body.innerHTML = `<p class="empty">No Tayks match.</p>`; return; }

  body.innerHTML = `
    <p class="lognote">Opening a photo records who opened it, and when.
      Details are text until you ask for the picture.</p>
    <div class="row" style="margin-bottom:12px">
      <button class="quiet" id="showAll">Show photos for all ${rows.length}</button>
    </div>
    <div class="tiles">
      ${rows.map(r => `
        <button class="tile" data-post="${esc(r.id)}" data-path="${esc(r.image_path)}">
          <div class="ph" data-slot="${esc(r.image_path)}">day ${esc(r.day_index)}</div>
          <div class="meta">
            ${face(r.avatar_path, r.username)} <b>@${esc(r.username)}</b>${
              r.suspended ? ` <span class="tag red">suspended</span>` : ""}<br>
            ${esc(r.prompt ?? "")}<br>
            <span class="muted">${esc(r.comment_count)}c · ${esc(r.like_count)}l${
              r.retayk_count > 0 ? ` · ${esc(r.retayk_count)} ReTayk` : ""}</span>
          </div>
        </button>`).join("")}
    </div>`;

  //  One tile, one deliberate look.
  body.querySelectorAll(".tile").forEach(t => {
    t.onclick = () => openPost(t.dataset.post);
  });

  document.getElementById("showAll").onclick = async (e) => {
    e.target.disabled = true;
    e.target.textContent = "Loading…";
    try {
      const paths = rows.map(r => r.image_path).filter(Boolean);
      const urls = await signPhotos(
        [...paths, ...paths.map(thumbOf)],
        `browsed ${rows.length} Tayks`);
      rows.forEach(r => {
        const slot = body.querySelector(`[data-slot="${CSS.escape(r.image_path)}"]`);
        if (!slot) return;
        const full = urls[r.image_path], thumb = urls[thumbOf(r.image_path)];
        slot.outerHTML = photoImg(thumb || full, thumb ? full : null, `@${r.username}`);
      });
      wirePhotoFallbacks(body);
      e.target.textContent = `${paths.length} photos loaded and logged`;
    } catch (err) {
      e.target.disabled = false;
      e.target.textContent = "Show photos for all";
      body.insertAdjacentHTML("afterbegin", `<p class="note">${esc(err.message)}</p>`);
    }
  };
}

async function openPost(id) {
  main.innerHTML = `<p class="muted">Loading…</p>`;
  let d;
  try { d = await rpc("admin_post_detail", { p_post: id }); }
  catch (e) { main.innerHTML = `<p class="note">${esc(e.message)}</p>`; return; }

  //  A post can be deleted between listing it and opening it, and a report
  //  outliving its content is the ordinary case. Draw the empty state.
  //
  //  Guarded on what this function actually NEEDS, not on whether the reply
  //  was null. admin_post_detail returns SQL NULL for a missing post, which
  //  arrives as null -- but a `!d` check alone passes anything else truthy
  //  straight through to `d.post.image_path` and throws on a screen whose
  //  whole job is to say the Tayk is gone.
  if (!d || !d.post) {
    main.innerHTML = `<button class="quiet" id="back">← Back</button>
      <div class="card"><p class="empty">That Tayk no longer exists.</p></div>`;
    document.getElementById("back").onclick = renderContent;
    return;
  }

  const post = d.post, comments = d.comments || [], retayks = d.retayks || [];
  let urls = {};
  let signErr = null;
  const paths = [post.image_path, thumbOf(post.image_path),
                 ...retayks.map(r => r.image_path)].filter(Boolean);
  try { urls = await signPhotos(paths, `opened @${post.username}'s Tayk`); }
  catch (e) { signErr = e.message; }

  await signFaces([post.avatar_path, ...comments.map(c => c.avatar_path)]);

  main.innerHTML = `
    <button class="quiet" id="back">← Back</button>
    <div class="card">
      <div class="row">
        <span class="tag">day ${esc(post.day_index)}</span>
        ${face(post.avatar_path, post.username)}
        <b>@${esc(post.username)}</b>
        ${post.enters_top_tayk ? `<span class="tag grey">Hot Tayk entry</span>` : ""}
      </div>
      <p class="muted">${esc(PROMPT_LEAD)} ${esc(post.prompt ?? "")}</p>
      ${signErr ? `<p class="note">${esc(signErr)}</p>`
                : photoImg(urls[post.image_path], null, `@${post.username}`)}
      ${post.caption ? `<p><b>@${esc(post.username)}:</b> “${esc(post.caption)}”</p>` : ""}
      <p class="muted">${esc(new Date(post.created_at).toLocaleString())}</p>
    </div>

    ${retayks.length ? `<h2>ReTayks</h2><div class="tiles">${retayks.map(r => `
      <div class="tile" style="cursor:default">
        ${photoImg(urls[r.image_path], null, "ReTayk")}
        <div class="meta">slot ${esc(r.slot)}${r.caption ? `<br>“${esc(r.caption)}”` : ""}</div>
      </div>`).join("")}</div>` : ""}

    <h2>Comments · ${comments.length}</h2>
    ${comments.length ? comments.map(c => `
      <div class="card">
        ${face(c.avatar_path, c.username)}
        <b>@${esc(c.username)}</b>
        <span class="muted"> · ${esc(new Date(c.at).toLocaleString())}</span>
        <p>${esc(c.body)}</p>
      </div>`).join("") : `<p class="empty">No comments.</p>`}`;

  wirePhotoFallbacks(main);
  document.getElementById("back").onclick = renderContent;
}
